[project]
name = "drishtisaathi-backend"
version = "0.1.0"
description = "DrishtiSaathi API: multilingual cataract-care assistant (intake, lens shortlist, grounded post-op Q&A, red-flag escalation)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
